<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>插件设置 - 搜索结果批量打开器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif;
      font-size: 14px;
      color: #333;
      background: #f5f7fa;
      min-height: 100vh;
    }

    .page-header {
      background: linear-gradient(135deg, #0078d4 0%, #005a9e 100%);
      color: white;
      padding: 24px 40px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .page-header h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .page-header p {
      font-size: 13px;
      opacity: 0.85;
    }

    .container {
      max-width: 680px;
      margin: 32px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      margin-bottom: 24px;
      overflow: hidden;
    }

    .card-header {
      padding: 16px 24px;
      border-bottom: 1px solid #eee;
      background: #fafafa;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-header h2 {
      font-size: 16px;
      font-weight: 600;
      color: #0078d4;
    }

    .card-header .icon {
      font-size: 20px;
    }

    .card-body {
      padding: 20px 24px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .setting-row:last-child {
      border-bottom: none;
    }

    .setting-label {
      flex: 1;
    }

    .setting-label .title {
      font-weight: 500;
      color: #333;
      margin-bottom: 3px;
    }

    .setting-label .desc {
      font-size: 12px;
      color: #999;
      line-height: 1.5;
    }

    .setting-control {
      flex-shrink: 0;
      margin-left: 20px;
    }

    input[type="number"] {
      width: 80px;
      padding: 7px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      text-align: center;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: #0078d4;
    }

    .shortcut-info {
      background: #f0f7ff;
      border: 1px solid #b3d9ff;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .shortcut-info .shortcut-key {
      display: inline-block;
      background: #0078d4;
      color: white;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      font-family: monospace;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .shortcut-info p {
      font-size: 13px;
      color: #555;
      line-height: 1.6;
    }

    .shortcut-info .note {
      margin-top: 8px;
      font-size: 12px;
      color: #888;
      padding-top: 8px;
      border-top: 1px dashed #c0d8f0;
    }

    .btn-chrome-shortcuts {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 18px;
      background: white;
      border: 1px solid #0078d4;
      color: #0078d4;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      margin-top: 4px;
    }

    .btn-chrome-shortcuts:hover {
      background: #0078d4;
      color: white;
    }

    .btn-save {
      display: block;
      width: 100%;
      padding: 12px;
      background: #0078d4;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }

    .btn-save:hover {
      background: #005a9e;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0,120,212,0.3);
    }

    .btn-save:active {
      transform: translateY(0);
    }

    .save-status {
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    .save-status.success {
      display: block;
      background: #e8f5e9;
      color: #2e7d32;
    }

    .save-status.error {
      display: block;
      background: #ffebee;
      color: #c62828;
    }
  </style>
</head>
<body>
  <div class="page-header">
    <h1>⚙️ 插件设置</h1>
    <p>搜索结果批量打开器 · 快捷键配置</p>
  </div>

  <div class="container">
    <!-- 快捷键说明卡片 -->
    <div class="card">
      <div class="card-header">
        <span class="icon">⌨️</span>
        <h2>快速打开快捷键</h2>
      </div>
      <div class="card-body">
        <div class="shortcut-info">
          <div class="shortcut-key" id="currentShortcut">Alt + Shift + O</div>
          <p>在 Bing 或 Google 搜索结果页面，按下此快捷键即可自动提取并打开前 N 个搜索结果，无需点开插件图标。</p>
          <div class="note">
            💡 注意：Chrome 的快捷键需要在浏览器快捷键管理页面修改。点击下方按钮前往修改。
          </div>
        </div>
        <a class="btn-chrome-shortcuts" href="#" id="shortcutsPageBtn">
          🔗 前往 Chrome 修改快捷键
        </a>
      </div>
    </div>

    <!-- 快捷键打开数量设置 -->
    <div class="card">
      <div class="card-header">
        <span class="icon">🎛️</span>
        <h2>快捷键打开数量</h2>
      </div>
      <div class="card-body">
        <div class="setting-row">
          <div class="setting-label">
            <div class="title">快捷键打开数量</div>
            <div class="desc">使用快捷键时，一次打开多少个搜索结果页面（默认 10 个，最多 50 个）</div>
          </div>
          <div class="setting-control">
            <input type="number" id="quickOpenCount" min="1" max="50" value="10">
          </div>
        </div>

        <button class="btn-save" id="saveBtn">💾 保存设置</button>
        <div class="save-status" id="saveStatus"></div>
      </div>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
