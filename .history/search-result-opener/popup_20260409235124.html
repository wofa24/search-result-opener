<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搜索结果批量打开器</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>搜索结果批量打开器</h2>
    </div>
    
    <div class="scroll-area">
      <div class="form-group">
        <label for="partNumber">料号:</label>
        <input type="text" id="partNumber" placeholder="自动提取或手动输入">
      </div>
      
      <div class="form-group">
        <label for="supplier">供应商:</label>
        <input type="text" id="supplier" placeholder="可选填写">
      </div>
      
      <div class="form-group">
        <label for="searchEngine">搜索引擎:</label>
        <select id="searchEngine" class="select-input">
          <option value="bing">Bing</option>
          <option value="google">Google</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>搜索选项:</label>
        <label class="checkbox-label">
          <input type="checkbox" id="exactMatch">
          <span>完全匹配</span>
        </label>
        <label for="fileType">文件格式:</label>
        <select id="fileType" class="select-input">
          <option value="none">不限制</option>
          <option value="pdf">PDF</option>
          <option value="doc">DOC/DOCX</option>
          <option value="xls">XLS/XLSX</option>
          <option value="image">图片(JPG/PNG)</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>打开数量:</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="count" value="5">
            <span>5个</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="count" value="10" checked>
            <span>10个</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="count" value="15">
            <span>15个</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="count" value="20">
            <span>20个</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="count" value="custom">
            <span>自定义</span>
            <input type="number" id="customCount" min="1" max="100" value="25" disabled>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label class="checkbox-label" id="createGroupLabel">
          <input type="checkbox" id="createGroup" checked>
          <span>创建标签页组</span>
          <span class="feature-badge" id="createGroupBadge"></span>
        </label>
      </div>

      <!-- 快捷键设置区 -->
      <div class="form-group shortcut-group">
        <div class="shortcut-header">
          <span class="shortcut-title">⌨️ 快捷键设置</span>
        </div>
        <div class="shortcut-row">
          <div class="shortcut-info-row">
            <span class="shortcut-label">当前快捷键:</span>
            <span class="shortcut-key-display" id="currentShortcut">读取中...</span>
          </div>
          <button class="shortcut-link-btn" id="openShortcutsBtn" title="前往 Chrome 修改快捷键">修改快捷键 →</button>
        </div>
        <div class="shortcut-count-row">
          <label for="quickOpenCount" class="shortcut-count-label">快捷键打开数量:</label>
          <input type="number" id="quickOpenCount" class="shortcut-count-input" min="1" max="50" value="10">
          <span class="shortcut-count-hint">个页面</span>
        </div>
      </div>

      <div class="history-container" id="historyContainer">
        <div class="history-header">最近搜索</div>
        <div id="historyList" class="history-list">
          <!-- 历史记录将通过 JS 动态添加 -->
        </div>
      </div>
      
      <div class="status" id="status"></div>
    </div>
    
    <div class="button-group">
      <button id="confirmBtn" class="btn btn-primary">确认打开</button>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
