<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搜索结果批量打开器</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>搜索结果批量打开器</h2>
    </div>
    
    <div class="scroll-area">
      <div class="form-group">
        <label for="partNumber">料号:</label>
        <input type="text" id="partNumber" placeholder="自动提取或手动输入">
      </div>
      
      <div class="form-group">
        <label for="supplier">供应商:</label>
        <input type="text" id="supplier" placeholder="可选填写">
      </div>
      
      <div class="form-group">
        <label for="searchEngine">搜索引擎:</label>
        <select id="searchEngine" class="select-input">
          <option value="bing">Bing</option>
          <option value="google">Google</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>搜索选项:</label>
        <label class="checkbox-label">
          <input type="checkbox" id="exactMatch">
          <span>完全匹配</span>
        </label>
        
        <label for="fileType">文件格式:</label>
        <select id="fileType" class="select-input">
          <option value="none">不限制</option>
          <option value="pdf">PDF</option>
          <option value="doc">DOC/DOCX</option>
          <option value="xls">XLS/XLSX</option>
          <option value="image">图片(JPG/PNG)</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>打开数量:</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="count" value="5">
            <span>5个</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="count" value="10" checked>
            <span>10个</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="count" value="15">
            <span>15个</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="count" value="20">
            <span>20个</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="count" value="custom">
            <span>自定义</span>
            <input type="number" id="customCount" min="1" max="100" value="25" disabled>
          </label>
        </div>
      </div>
      
      <div class="form-group">
        <div class="advanced-toggle" id="advancedToggle">
          <span class="toggle-icon">▶</span>
          <span>高级功能</span>
        </div>
        
        <div class="advanced-options" id="advancedOptions" style="display: none;">
          <label for="siteLimit">限定站点 <span class="hint-text">(多个用逗号分隔，如 1688.com,jd.com)</span>:</label>
          <input type="text" id="siteLimit" class="select-input" placeholder="例: 1688.com, jd.com">
          
          <label for="excludeSite">排除站点 <span class="hint-text">(多个用逗号分隔，如 zhihu.com,csdn.net)</span>:</label>
          <input type="text" id="excludeSite" class="select-input" placeholder="例: zhihu.com, csdn.net">

          <div class="advanced-section-divider">标签页与导航</div>

          <label class="checkbox-label" id="createGroupLabel">
            <input type="checkbox" id="createGroup" checked>
            <span>创建标签页组</span>
            <span class="feature-badge" id="createGroupBadge"></span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="openSidebar" checked>
            <span>打开后自动开启侧边栏导航</span>
            <span class="feature-badge" id="openSidebarBadge"></span>
          </label>

          <div class="advanced-section-divider">快捷键设置</div>

          <label for="quickOpenCount">快捷键打开数量 <span class="hint-text">(在搜索页按快捷键时打开的页面数，默认 10)</span>:</label>
          <input type="number" id="quickOpenCount" class="select-input" min="1" max="50" value="10" placeholder="默认 10">
        </div>
      </div>

      <div class="history-container" id="historyContainer">
        <div class="history-header">最近搜索</div>
        <div id="historyList" class="history-list">
          <!-- 历史记录将通过 JS 动态添加 -->
        </div>
      </div>
      
      <div class="status" id="status"></div>
    </div>
    
    <div class="button-group">
      <button id="confirmBtn" class="btn btn-primary">确认打开</button>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
