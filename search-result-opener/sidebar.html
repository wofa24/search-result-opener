<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搜索结果导航</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div class="sidebar-container">
    <div class="header">
      <h3>搜索结果导航</h3>
      <button id="closeBtn" class="close-btn" title="关闭侧边栏">×</button>
    </div>
    
    <div class="info-section">
      <div class="info-item">
        <span class="label">料号:</span>
        <span id="partNumber" class="value">-</span>
      </div>
      <div class="info-item">
        <span class="label">供应商:</span>
        <span id="supplier" class="value">-</span>
      </div>
      <div class="info-item">
        <span class="label">已打开:</span>
        <span id="tabCount" class="value">0个页面</span>
      </div>
    </div>
    
    <div class="tab-list" id="tabList">
      <div class="empty-state">
        <p>暂无标签页</p>
        <p class="hint">使用插件打开搜索结果后，这里会显示所有页面</p>
      </div>
    </div>
    
    <div class="footer">
      <button id="prevBtn" class="nav-btn">
        <span>↑</span>
        <span>上一个</span>
      </button>
      <button id="nextBtn" class="nav-btn">
        <span>↓</span>
        <span>下一个</span>
      </button>
    </div>
  </div>
  
  <script src="sidebar.js"></script>
</body>
</html>
